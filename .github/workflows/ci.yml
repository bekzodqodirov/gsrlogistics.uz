# Type-checks and builds every pull request so broken changes never reach main.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `astro check` — the type-check the header above promises. It needs @astrojs/check +
      # typescript, which are devDependencies, so `npm ci` installs them.
      - run: npm run check
      - run: npm run test:pricing
      - run: npm run test:cyrillic
      - run: npm run test:locale
      - run: npm run build
